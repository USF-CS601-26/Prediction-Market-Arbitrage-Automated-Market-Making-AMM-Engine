[pytest]
# `pytest` from the repo root collects the cross-venue suite in tests/.
# The import path covers engine/ (this folder) plus the two venue engines,
# which use flat intra-package imports (`from models import ...`).
#
# The per-venue suites are run from their own folders and are not collected
# here, because kalshi_engine/tests reaches the live Kalshi API for fee
# schedules and takes about 90 seconds:
#     cd kalshi_engine     && python -m pytest tests
#     cd Polymarket_engine && python -m pytest tests
testpaths = tests
pythonpath = . kalshi_engine Polymarket_engine

# The recorded-tape integration tests replay ~2600 frames each and dominate
# the runtime. For a fast inner loop:  pytest -m "not slow"
markers =
    slow: replays a recorded tape end to end (a few seconds each)
